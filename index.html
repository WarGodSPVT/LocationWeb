<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Location Share</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
            padding: 40px 20px;
        }

        .box {
            max-width: 400px;
            margin: auto;
            background: #222;
            padding: 25px;
            border-radius: 15px;
        }

        input,
        button {
            width: 100%;
            box-sizing: border-box;
            padding: 14px;
            margin-top: 12px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }

        button {
            background: #4f7cff;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
        }

        #status {
            margin-top: 20px;
            line-height: 1.5;
        }

        .notice {
            color: #aaa;
            font-size: 13px;
            margin-top: 15px;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Share Your Location</h1>

        <p>
            Enter your name and choose whether you want to share
            your current location.
        </p>

        <input
            id="name"
            type="text"
            placeholder="Your name"
            maxlength="80"
        >

        <button id="shareButton" onclick="shareLocation()">
            Share My Location
        </button>

        <div id="status"></div>

        <div class="notice">
            Your browser will ask for location permission.
            Your location is sent only after you allow access.
        </div>

    </div>

    <script>

        async function shareLocation() {

            const name =
                document.getElementById("name").value.trim();

            const status =
                document.getElementById("status");

            const button =
                document.getElementById("shareButton");


            if (!name) {

                status.innerText =
                    "Please enter your name.";

                return;
            }


            if (!navigator.geolocation) {

                status.innerText =
                    "Location is not supported by this browser.";

                return;
            }


            status.innerText =
                "Requesting location permission...";

            button.disabled = true;


            navigator.geolocation.getCurrentPosition(

                async function(position) {

                    status.innerText =
                        "Location received. Sending to server...";


                    const data = {

                        name: name,

                        latitude:
                            position.coords.latitude,

                        longitude:
                            position.coords.longitude,

                        accuracy:
                            position.coords.accuracy,

                        time:
                            new Date().toISOString()
                    };


                    try {

                        const response =
                            await fetch("/submit", {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify(data)
                            });


                        if (!response.ok) {

                            throw new Error(
                                "Server returned " +
                                response.status
                            );
                        }


                        status.innerText =
                            "Location submitted successfully!";

                    }

                    catch (error) {

                        console.error(error);

                        status.innerText =
                            "Location was received, but sending failed.";
                    }

                    finally {

                        button.disabled = false;
                    }
                },


                function(error) {

                    console.log(
                        "Geolocation error:",
                        error
                    );


                    if (error.code === 1) {

                        status.innerText =
                            "Location permission was denied.";

                    } else if (error.code === 2) {

                        status.innerText =
                            "Location is currently unavailable.";

                    } else if (error.code === 3) {

                        status.innerText =
                            "Location request timed out.";

                    } else {

                        status.innerText =
                            "Could not get your location.";
                    }


                    button.disabled = false;
                },


                {

                    enableHighAccuracy: false,

                    timeout: 50000,

                    maximumAge: 60000
                }

            );
        }

    </script>

</body>

</html>
